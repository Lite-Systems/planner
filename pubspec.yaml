name: planner
description: "A new Flutter project."
publish_to: 'none'
version: 1.3.0+12

environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6 # Changed from ^1.0.8
  provider: ^6.1.5+1
  easy_localization: ^3.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  fl_chart: ^1.1.0
  local_auth: ^3.0.2
  pdf: ^3.11.3
  printing: ^5.14.2
  uuid: ^4.5.2
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  flutter_launcher_icons: ^0.14.4
  speech_to_text: ^7.4.0
  flutter_local_notifications: ^22.0.1
  image_picker: ^1.1.2
  upgrader: ^13.5.0
  share_plus: ^13.2.0
  file_picker: ^12.0.0
  timezone: ^0.11.0
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0

dependency_overrides:
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/translations/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf 
          weight: 400
