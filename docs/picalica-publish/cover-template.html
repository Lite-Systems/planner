<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>غلاف بيكاليكا — المخطط الذكي</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; }
  .cover {
    width: 1700px;
    height: 970px;
    box-sizing: border-box;
    background: linear-gradient(135deg, #0f1f33 0%, #16324d 55%, #1f6f8b 100%);
    display: block;
    position: relative;
    overflow: hidden;
    font-family: "Almarai", "Segoe UI", Tahoma, sans-serif;
  }
  .art {
    position: absolute; border-radius: 50%;
    filter: blur(0.5px); opacity: .35;
  }
  .a1 { width: 420px; height: 420px; background: #2b90a9; right: -120px; top: -120px; }
  .a2 { width: 300px; height: 300px; background: #2b5f8f; left: -80px; bottom: -100px; }
  .phone {
    position: absolute; left: 130px; top: 120px;
    width: 300px; height: 620px; border-radius: 34px;
    background: #0c1622; border: 6px solid #f3f6f9;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    padding: 22px; box-sizing: border-box; color: #e8eef4;
  }
  .phone .bar { height: 12px; width: 60px; margin: 0 auto 18px; border-radius: 8px; background: #2a3947; }
  .card {
    background: #162735;
    border-radius: 14px; padding: 14px; margin-bottom: 14px;
    font-size: 15px;
  }
  .card .k { color: #8fb2cc; font-size: 12px; }
  .card .v { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .card.g .v { color: #57d9a3; }
  .card.b .v { color: #62b0f5; }
  .card.r .v { color: #f28b82; }
  .pill { display: inline-block; background: #22384d; color: #9fc4dc; font-size: 12px; padding: 6px 10px; border-radius: 999px; margin: 4px 4px 0 0; }
  .text {
    position: absolute;
    right: 90px;
    top: 50%;
    transform: translateY(-50%);
    width: 880px;
    text-align: right;
    color: #f2f6fa;
  }
  .brand {
    font-size: 76px; font-weight: 800; line-height: 1.15; margin: 0 0 18px;
    background: linear-gradient(90deg, #ffffff, #9adcf0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 34px; color: #cfe3f2; margin: 0 0 26px; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; }
  .chip {
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22);
    padding: 10px 16px; border-radius: 999px; font-size: 18px; color: #eaf4fb;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="art a1"></div>
  <div class="art a2"></div>

  <!-- جهاز توضيحي: يُستبدل بلقطة حقيقية من التطبيق عند التصوير النهائي -->
  <div class="phone" dir="rtl">
    <div class="bar"></div>
    <div class="card b"><div class="k">صافي الرصيد</div><div class="v">12,480 ج.م</div></div>
    <div class="card g"><div class="k">مُحصّل</div><div class="v">9,200</div></div>
    <div class="card r"><div class="k">معلّق</div><div class="v">3,280</div></div>
    <div class="card"><div class="k">تقدم المهام</div><div class="v">72%</div>
      <div style="background:#22384d;border-radius:8px;height:8px;margin-top:8px">
        <div style="width:72%;height:8px;border-radius:8px;background:#57d9a3"></div>
      </div>
    </div>
    <div>
      <span class="pill">مشروع متجر</span>
      <span class="pill">تحرير</span>
      <span class="pill">تطبيق</span>
    </div>
  </div>

  <div class="text">
    <h1 class="brand">المخطط الذكي</h1>
    <p class="sub">إدارة المشاريع والمهام والمالية<br>في تطبيق واحد يعمل دون إنترنت</p>
    <div class="chips">
      <span class="chip">مشاريع ومهام</span>
      <span class="chip">تتبع وقت</span>
      <span class="chip">إيرادات ومصروفات</span>
      <span class="chip">فواتير PDF</span>
      <span class="chip">عربي / إنجليزي</span>
      <span class="chip">شيفرة Flutter كاملة</span>
    </div>
  </div>
</div>
</body>
</html>
