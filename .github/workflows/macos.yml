name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  MACOS_RELEASE_DIR: build/macos/Build/Products/Release
  MACOS_DMG: build/macos/artifacts/planner.dmg

jobs:
  build-macos:
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Enable macOS desktop
        # printing still requires the project's CocoaPods integration on macOS.
        run: flutter config --enable-macos-desktop --no-enable-swift-package-manager --no-enable-macos-arm64-only

      - name: Show build toolchain
        run: |
          xcodebuild -version
          pod --version
          flutter doctor -v

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS release
        env:
          # Override every Xcode target without changing local Apple signing.
          # Ad-hoc signing needs no certificate/private key on the runner.
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/macos/Runner/Configs/CI.xcconfig
        run: |
          flutter build macos --release --no-pub
          ruby macos/Tests/check_ci_signing.rb

      - name: Describe CI signing limitations
        run: |
          echo '::notice::This CI DMG is ad-hoc signed, not notarized. Widget App Group sharing requires an Apple-signed build.'
          echo '### macOS CI build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Certificate-free, ad-hoc-signed test build. Not notarized; macOS widget sharing requires the app and extension to be signed with the same Apple team.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate macOS app
        run: |
          shopt -s nullglob
          apps=("$MACOS_RELEASE_DIR"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo 'Expected exactly one macOS app bundle in the release directory.' >&2
            exit 1
          fi
          app="${apps[0]}"

          plutil -lint "$app/Contents/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -x "$app/Contents/MacOS/$executable"
          test -s "$app/Contents/Frameworks/FlutterMacOS.framework/FlutterMacOS"
          test -s "$app/Contents/Frameworks/App.framework/App"
          test -d "$app/Contents/Frameworks/App.framework/Resources/flutter_assets"
          xcrun lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          xcrun lipo "$app/Contents/Frameworks/FlutterMacOS.framework/FlutterMacOS" -verify_arch arm64 x86_64
          xcrun lipo "$app/Contents/Frameworks/App.framework/App" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"

      - name: Create macOS DMG
        run: |
          shopt -s nullglob
          apps=("$MACOS_RELEASE_DIR"/*.app)
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT

          # ditto preserves bundle symlinks, resource forks, and executable permissions.
          ditto "${apps[0]}" "$staging/planner.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "$(dirname "$MACOS_DMG")"
          hdiutil create -volname 'planner' -srcfolder "$staging" \
            -format UDZO -fs HFS+ -ov "$MACOS_DMG"
          test -s "$MACOS_DMG"
          hdiutil verify "$MACOS_DMG"

      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ${{ env.MACOS_DMG }}
          if-no-files-found: error
          retention-days: 30
